<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  color: pink;
}

.card {
  background: white;
  padding: 40px 30px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 15px 30px rgba(0,0,0,0.25);
  max-width: 90%;
  z-index: 2;
  color: pink;
}

button {
  font-size: 18px;
  padding: 12px 24px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  margin: 10px;
  color: pink;
}

.yes {
  background-color: #ff4d6d;
}

.no {
  background-color: #ddd;
}

/* Floating emojis */
.heart, .kiss {
  position: absolute;
  bottom: -20px;
  animation: floatUp 6s linear forwards;
  opacity: 0.9;
}

@keyframes floatUp {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-110vh); opacity: 0; }
}

/* iMessage style */
.imessage {
  background: #f5f5f7;
  border-radius: 20px;
  padding: 20px;
  width: 280px;
  margin: auto;
  text-align: left;
  color: pink;
}

.bubble {
  padding: 10px 14px;
  border-radius: 18px;
  margin-bottom: 10px;
  max-width: 85%;
  font-size: 15px;
  color: pink;
}

.from-them { background: #ffe5f0; }
.from-me { background: #ff4d6d; margin-left: auto; }

/* Fireworks */
.firework {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  animation: explode 1s ease-out forwards;
}

@keyframes explode {
  to {
    transform: translate(var(--x), var(--y)) scale(0);
    opacity: 0;
  }
}

/* Countdown */
#countdown {
  font-size: 22px;
  margin-top: 20px;
  font-weight: bold;
}
</style>
</head>

<body>

<audio id="music" src="wgft.mp3"></audio>

<div class="card" id="card">
  <h2>Lilly-may… will you be my Valentine? 💘</h2>
  <p>Don’t overthink it 😌</p>
  <button class="yes" onclick="answerQuestion('yes')">Yes 💖</button>
  <button class="no" onclick="answerQuestion('no')">No 💔</button>
</div>

<script>
const card = document.getElementById("card");
const music = document.getElementById("music");

const questionsYes = [
  "Are you sure? 😘",
  "Really, REALLY sure? 💖",
  "You won’t regret this, right? 😏",
  "Tell me again, am I your Valentine? 💘",
  "Promise you’ll stay my Valentine? 💞"
];

const questionsNo = [
  "Come on, be serious 😌💘",
  "I won’t take no for an answer 😎",
  "Why are you lying? 💔",
  "Don’t you want to be my Valentine? 😏",
  "Please say yes 😢"
];

let currentQuestion = 0;
let currentSet = [];

function answerQuestion(type) {
  if (music.paused) music.play();

  // If first answer, create chat container
  if (!document.querySelector(".imessage")) {
    card.innerHTML = `<h2>Messages 💬</h2><div class="imessage"></div>`;
  }

  currentSet = type === "yes" ? questionsYes : questionsNo;
  const chat = document.querySelector(".imessage");

  // Add bubble
  const bubble = document.createElement("div");
  bubble.className = type === "yes" ? "bubble from-me" : "bubble from-them";
  bubble.innerText = currentSet[currentQuestion];
  chat.appendChild(bubble);
  chat.scrollTop = chat.scrollHeight;

  fireworks(15);
  startEmojis();

  currentQuestion++;

  // Show next buttons if more questions left
  const existingBtns = document.querySelector(".btns");
  if (existingBtns) existingBtns.remove();

  if (currentQuestion < currentSet.length) {
    const btns = document.createElement("div");
    btns.className = "btns";
    btns.innerHTML = `
      <button class="yes" onclick="answerQuestion('yes')">Yes 💖</button>
      <button class="no" onclick="answerQuestion('no')">No 💔</button>
    `;
    card.appendChild(btns);
  } else {
    showFinalMessage();
  }
}

function showFinalMessage() {
  card.innerHTML = `
    <h2>You're going to be my Valentine 😘</h2>
    <div id="countdown"></div>
  `;
  startCountdown();
}

/* Countdown to February 14 */
function startCountdown() {
  const countdown = document.getElementById("countdown");
  const valentine = new Date(new Date().getFullYear(), 1, 14); // Feb 14

  function updateCountdown() {
    const now = new Date();
    let diff = valentine - now;

    if (diff < 0) {
      countdown.innerText = "Happy Valentine’s Day! 💖";
      clearInterval(interval);
      return;
    }

    const days = Math.floor(diff / (1000*60*60*24));
    const hours = Math.floor((diff / (1000*60*60)) % 24);
    const minutes = Math.floor((diff / (1000*60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    countdown.innerText = `${days}d ${hours}h ${minutes}m ${seconds}s until Valentine’s Day 💘`;
  }

  updateCountdown();
  const interval = setInterval(updateCountdown, 1000);
}

/* Fireworks */
function fireworks(n) {
  for (let i = 0; i < n; i++) {
    const f = document.createElement("div");
    f.className = "firework";
    f.style.left = Math.random() * innerWidth + "px";
    f.style.top = Math.random() * innerHeight + "px";
    f.style.background = `hsl(${Math.random()*360},100%,60%)`;
    f.style.setProperty("--x", Math.random()*200-100+"px");
    f.style.setProperty("--y", Math.random()*200-100+"px");
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 1000);
  }
}

/* Floating hearts & kisses */
function startEmojis() {
  const emoji = document.createElement("div");
  emoji.className = Math.random() > 0.5 ? "heart" : "kiss";
  emoji.innerText = emoji.className === "heart" ? "❤️" : "😘";
  emoji.style.left = Math.random() * 100 + "vw";
  emoji.style.fontSize = Math.random() * 20 + 18 + "px";
  emoji.style.animationDuration = Math.random() * 3 + 4 + "s";
  document.body.appendChild(emoji);
  setTimeout(() => emoji.remove(), 7000);
}
</script>

</body>
</html>
