<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
}

.card {
  background: white;
  padding: 40px 30px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 15px 30px rgba(0,0,0,0.25);
  max-width: 90%;
  z-index: 5;
}

h1 { color: #ff4d6d; }

button {
  font-size: 18px;
  padding: 12px 24px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  margin: 10px;
}

/* YES button */
#yes {
  background: #ff4d6d;
  color: white;
  position: absolute;
}

/* NO button */
#no {
  background: #ddd;
  position: absolute;
  left: 50%;
  top: 60%;
  transform: translate(-50%, -50%);
  transition: opacity 1s;
}

/* YES chaos */
@keyframes shake {
  0% { transform: translate(0); }
  25% { transform: translate(-3px,3px); }
  50% { transform: translate(3px,-3px); }
  75% { transform: translate(-3px,-3px); }
  100% { transform: translate(0); }
}

.annoying {
  animation: shake 0.25s infinite;
}

/* Fireworks */
.firework {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  animation: explode 1s ease-out forwards;
}

@keyframes explode {
  to {
    transform: translate(var(--x), var(--y)) scale(0);
    opacity: 0;
  }
}

/* Confetti */
.confetti {
  position: absolute;
  width: 8px;
  height: 8px;
  animation: fall 3s linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(720deg);
    opacity: 0;
  }
}

/* Flash */
.flash {
  position: fixed;
  inset: 0;
  background: white;
  opacity: 0;
  z-index: 10;
}

.flash.active {
  opacity: 0.8;
  transition: opacity 0.2s;
}

/* Final takeover */
#final {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #ff4d6d, #ff85a1);
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  color: white;
  z-index: 20;
  text-align: center;
}
</style>
</head>

<body>

<div class="flash" id="flash"></div>

<!-- Put wgft.mp3 in the SAME folder -->
<audio id="music" src="wgft.mp3"></audio>

<div class="card" id="card">
  <h1>Lilly-may… will you be my Valentine? 💘</h1>
  <p>You know the answer 😌</p>
  <button id="yes" onclick="yesClicked()">Yes 💖</button>
  <button id="no" onmouseover="moveNo()">No 💔</button>
</div>

<div id="final">
  <h1>VALENTINE CONFIRMED 💘</h1>
  <p>No refunds. No take backs.</p>
  <p>Screenshot this 😌</p>
</div>

<script>
let yesCount = 0;

function yesClicked() {
  const yes = document.getElementById("yes");
  const no = document.getElementById("no");
  const music = document.getElementById("music");

  if (music.paused) music.play();
  yesCount++;

  yes.classList.add("annoying");
  yes.style.transform = `scale(${1 + yesCount * 0.2})`;

  flashScreen();
  vibrate();
  fireworks(20 + yesCount * 15);
  confetti(40);

  for (let i = 0; i < yesCount; i++) spawnFakeYes();

  if (yesCount >= 4) {
    no.style.opacity = "0";
  }

  if (yesCount >= 6) {
    document.getElementById("card").style.display = "none";
    document.getElementById("final").style.display = "flex";
    fireworks(100);
    confetti(150);
  }
}

// NO button runs away
function moveNo() {
  const no = document.getElementById("no");
  no.style.left = Math.random() * (window.innerWidth - 100) + "px";
  no.style.top = Math.random() * (window.innerHeight - 50) + "px";
}

// YES follows mouse
document.addEventListener("mousemove", e => {
  const yes = document.getElementById("yes");
  if (!yes) return;
  yes.style.left = (e.clientX - 40) + "px";
  yes.style.top = (e.clientY - 20) + "px";
});

// YES follows finger (mobile)
document.addEventListener("touchmove", e => {
  const yes = document.getElementById("yes");
  if (!yes) return;
  const t = e.touches[0];
  yes.style.left = (t.clientX - 40) + "px";
  yes.style.top = (t.clientY - 20) + "px";
});

// Fireworks
function fireworks(n) {
  for (let i = 0; i < n; i++) {
    const f = document.createElement("div");
    f.className = "firework";
    f.style.left = Math.random() * innerWidth + "px";
    f.style.top = Math.random() * innerHeight + "px";
    f.style.background = `hsl(${Math.random()*360},100%,60%)`;
    f.style.setProperty("--x", Math.random()*200-100+"px");
    f.style.setProperty("--y", Math.random()*200-100+"px");
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 1000);
  }
}

// Confetti
function confetti(n) {
  for (let i = 0; i < n; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random()*100+"vw";
    c.style.background = `hsl(${Math.random()*360},100%,60%)`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3000);
  }
}

// Fake YES buttons
function spawnFakeYes() {
  const b = document.createElement("button");
  b.innerText = "YES 💖";
  b.style.position = "absolute";
  b.style.left = Math.random()*window.innerWidth+"px";
  b.style.top = Math.random()*window.innerHeight+"px";
  b.onclick = yesClicked;
  document.body.appendChild(b);
  setTimeout(()=>b.remove(),2000);
}

// Flash
function flashScreen() {
  const f = document.getElementById("flash");
  f.classList.add("active");
  setTimeout(()=>f.classList.remove("active"),200);
}

// Vibration
function vibrate() {
  if (navigator.vibrate) navigator.vibrate(200);
}
</script>

</body>
</html>
