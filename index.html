<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    }

    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 30px rgba(0,0,0,0.25);
      max-width: 90%;
      z-index: 2;
    }

    h1 {
      color: #ff4d6d;
      font-size: 26px;
      margin-bottom: 15px;
    }

    p {
      font-size: 17px;
    }

    button {
      font-size: 18px;
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      margin: 10px;
    }

    #yes {
      background-color: #ff4d6d;
      color: white;
    }

    #no {
      background-color: #ddd;
      position: absolute;
    }

    .heart, .kiss {
      position: absolute;
      bottom: -20px;
      animation: floatUp 6s linear infinite;
      opacity: 0.9;
    }

    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-110vh); opacity: 0; }
    }

    /* iMessage style */
    .imessage {
      background: #f5f5f7;
      border-radius: 20px;
      padding: 20px;
      width: 280px;
      margin: auto;
      text-align: left;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 18px;
      margin-bottom: 10px;
      max-width: 85%;
      font-size: 15px;
    }

    .from-them {
      background: #e5e5ea;
      color: black;
    }

    .from-me {
      background: #0b93f6;
      color: white;
      margin-left: auto;
      text-align: right;
    }
  </style>
</head>

<body>

  <audio id="music" src="wgft.mp3"></audio>

  <div class="card" id="card">
    <h1>Lilly-may… will you be my Valentine? 💘</h1>
    <p>Don’t overthink it like you always do 😌</p>
    <button id="yes" onclick="yesClicked()">Yes 💖</button>
    <button id="no" onmouseover="moveNo()">No 💔</button>
  </div>

  <script>
    let yesCount = 0;

    function yesClicked() {
      const card = document.getElementById("card");
      const music = document.getElementById("music");
      if (music.paused) music.play();

      yesCount++;

      if (yesCount === 1) {
        card.innerHTML = `
          <h1>Wait 🤨</h1>
          <p>Are you sure… or are you gonna get moody and say no later?</p>
          <button onclick="yesClicked()">I’m sure 💖</button>
        `;
      } else if (yesCount === 2) {
        card.innerHTML = `
          <h1>Hmm 😏</h1>
          <p>No switching up. No attitude. No fake yes.</p>
          <button onclick="yesClicked()">Okay fine yes 💖</button>
        `;
      } else {
        card.innerHTML = `
          <h1>Messages 💬</h1>
          <div class="imessage">
            <div class="bubble from-them">So… are you my Valentine? 👀</div>
            <div class="bubble from-me">Yeah 🙄💖</div>
            <div class="bubble from-them">You promise you won’t say no later?</div>
            <div class="bubble from-me">I promise 😘</div>
            <div class="bubble from-them">Good. Valentine secured 🔒</div>
          </div>
          <p style="margin-top:15px; text-align:center;">Screenshot this and send it to me 😌</p>
        `;
      }
    }

    function moveNo() {
      const noBtn = document.getElementById("no");
      const x = Math.random() * (window.innerWidth - 120);
      const y = Math.random() * (window.innerHeight - 60);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    function createFloatingEmoji() {
      const emoji = document.createElement("div");
      emoji.className = Math.random() > 0.5 ? "heart" : "kiss";
      emoji.innerText = emoji.className === "heart" ? "❤️" : "😘";
      emoji.style.left = Math.random() * 100 + "vw";
      emoji.style.fontSize = Math.random() * 20 + 18 + "px";
      emoji.style.animationDuration = Math.random() * 3 + 4 + "s";
      document.body.appendChild(emoji);

      setTimeout(() => emoji.remove(), 7000);
    }

    setInterval(createFloatingEmoji, 350);
  </script>

</body>
</html>
