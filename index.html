<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
}

.card {
  background: white;
  padding: 40px 30px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 15px 30px rgba(0,0,0,0.25);
  max-width: 90%;
  z-index: 5;
}

h1 { color: #ff4d6d; }

button {
  font-size: 18px;
  padding: 12px 24px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  margin: 10px;
}

#yes {
  background: #ff4d6d;
  color: white;
}

#no {
  background: #ddd;
}

/* Fireworks */
.firework {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  animation: explode 1s ease-out forwards;
}

@keyframes explode {
  to {
    transform: translate(var(--x), var(--y)) scale(0);
    opacity: 0;
  }
}

/* Confetti */
.confetti {
  position: absolute;
  width: 8px;
  height: 8px;
  animation: fall 3s linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(720deg);
    opacity: 0;
  }
}

/* Flash */
.flash {
  position: fixed;
  inset: 0;
  background: white;
  opacity: 0;
  z-index: 10;
}

.flash.active {
  opacity: 0.8;
  transition: opacity 0.2s;
}

/* Final screen */
#final {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #ff4d6d, #ff85a1);
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  color: white;
  z-index: 20;
  text-align: center;
}
</style>
</head>

<body>

<div class="flash" id="flash"></div>

<audio id="music" src="wgft.mp3"></audio>

<div class="card" id="card">
  <h1>Lilly-may… will you be my Valentine? 💘</h1>
  <p>You know the answer 😌</p>
  <button id="yes" onclick="yesClicked()">Yes 💖</button>
  <button id="no" onclick="noClicked()">No 💔</button>
</div>

<div id="final">
  <h1>VALENTINE CONFIRMED 💘</h1>
  <p>No refunds. No take backs.</p>
  <p>Screenshot this 😌</p>
</div>

<script>
let yesCount = 0;

function yesClicked() {
  const music = document.getElementById("music");
  if (music.paused) music.play();

  yesCount++;

  flashScreen();
  fireworks(40);
  confetti(60);

  if (yesCount >= 2) {
    document.getElementById("card").style.display = "none";
    document.getElementById("final").style.display = "flex";
    fireworks(100);
    confetti(150);
  }
}

function noClicked() {
  alert("Wrong answer 😌💘");
}

// Fireworks
function fireworks(n) {
  for (let i = 0; i < n; i++) {
    const f = document.createElement("div");
    f.className = "firework";
    f.style.left = Math.random() * innerWidth + "px";
    f.style.top = Math.random() * innerHeight + "px";
    f.style.background = `hsl(${Math.random()*360},100%,60%)`;
    f.style.setProperty("--x", Math.random()*200-100+"px");
    f.style.setProperty("--y", Math.random()*200-100+"px");
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 1000);
  }
}

// Confetti
function confetti(n) {
  for (let i = 0; i < n; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random()*100+"vw";
    c.style.background = `hsl(${Math.random()*360},100%,60%)`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3000);
  }
}

// Flash
function flashScreen() {
  const f = document.getElementById("flash");
  f.classList.add("active");
  setTimeout(()=>f.classList.remove("active"),200);
}
</script>

</body>
</html>
