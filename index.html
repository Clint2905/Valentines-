<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  color: pink;
}

.card {
  background: white;
  padding: 40px 30px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 15px 30px rgba(0,0,0,0.25);
  max-width: 90%;
  z-index: 2;
  color: pink;
}

button {
  font-size: 18px;
  padding: 12px 24px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  margin: 10px;
  color: pink;
}

.yes {
  background-color: #ff4d6d;
}

.no {
  background-color: #ddd;
}

/* Floating emojis */
.heart, .kiss {
  position: absolute;
  bottom: -20px;
  animation: floatUp 6s linear infinite;
  opacity: 0.9;
}

@keyframes floatUp {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-110vh); opacity: 0; }
}

/* iMessage style */
.imessage {
  background: #f5f5f7;
  border-radius: 20px;
  padding: 20px;
  width: 280px;
  margin: auto;
  text-align: left;
  color: pink;
}

.bubble {
  padding: 10px 14px;
  border-radius: 18px;
  margin-bottom: 10px;
  max-width: 85%;
  font-size: 15px;
  color: pink;
}

.from-them { background: #ffe5f0; }
.from-me { background: #ff4d6d; margin-left: auto; }

/* Fireworks */
.firework {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  animation: explode 1s ease-out forwards;
}

@keyframes explode {
  to {
    transform: translate(var(--x), var(--y)) scale(0);
    opacity: 0;
  }
}
</style>
</head>

<body>

<audio id="music" src="wgft.mp3"></audio>

<div class="card" id="card">
  <h2>Lilly-may… will you be my Valentine? 💘</h2>
  <p>Don’t overthink it 😌</p>
  <button class="yes" onclick="yesClicked()">Yes 💖</button>
  <button class="no" onclick="noClicked()">No 💔</button>
</div>

<script>
const card = document.getElementById("card");
const music = document.getElementById("music");

function annoyUser(type) {
  const messagesYes = [
    "Are you sure? 😘",
    "Really, REALLY sure? 💖",
    "You won’t regret this, right? 😏",
    "Tell me again, am I your Valentine? 💘"
  ];
  
  const messagesNo = [
    "Come on, be serious 😌💘",
    "I won’t take no for an answer 😎",
    "Why are you lying? 💔",
    "Don’t you want to be my Valentine? 😏"
  ];
  
  const msgArray = type === "yes" ? messagesYes : messagesNo;
  const randomMsg = msgArray[Math.floor(Math.random() * msgArray.length)];
  
  const bubble = document.createElement("div");
  bubble.className = type === "yes" ? "bubble from-me" : "bubble from-them";
  bubble.innerText = randomMsg;
  
  const chat = document.querySelector(".imessage") || createChat();
  chat.appendChild(bubble);
  chat.scrollTop = chat.scrollHeight;
  
  fireworks(15);
  startEmojis();
  
  // Repeat annoy every 3-5 seconds
  setTimeout(() => annoyUser(type), Math.random()*2000 + 3000);
}

function createChat() {
  card.innerHTML = `<h2>Messages 💬</h2><div class="imessage"></div>`;
  return document.querySelector(".imessage");
}

function yesClicked() {
  if (music.paused) music.play();
  annoyUser("yes");
}

function noClicked() {
  annoyUser("no");
}

/* Fireworks */
function fireworks(n) {
  for (let i = 0; i < n; i++) {
    const f = document.createElement("div");
    f.className = "firework";
    f.style.left = Math.random() * innerWidth + "px";
    f.style.top = Math.random() * innerHeight + "px";
    f.style.background = `hsl(${Math.random()*360},100%,60%)`;
    f.style.setProperty("--x", Math.random()*200-100+"px");
    f.style.setProperty("--y", Math.random()*200-100+"px");
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 1000);
  }
}

/* Floating hearts & kisses */
function startEmojis() {
  const emoji = document.createElement("div");
  emoji.className = Math.random() > 0.5 ? "heart" : "kiss";
  emoji.innerText = emoji.className === "heart" ? "❤️" : "😘";
  emoji.style.left = Math.random() * 100 + "vw";
  emoji.style.fontSize = Math.random() * 20 + 18 + "px";
  emoji.style.animationDuration = Math.random() * 3 + 4 + "s";
  document.body.appendChild(emoji);
  setTimeout(() => emoji.remove(), 7000);
}
</script>

</body>
</html>
